# Optional private-host configuration; creating this file does not deploy anything.
services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
